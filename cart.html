
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <div class="cart-container">

        <h1>My Shopping Cart</h1>

        <div class="cart-item">
            <h3>Product: Laptop</h3>
            <p>Price: ₹50,000</p>
            <p>Quantity: 1</p>
            <button>Add to Cart</button>
        </div>

        <div class="cart-item">
            <h3>Product: Headphones</h3>
            <p>Price: ₹2,000</p>
            <p>Quantity: 1</p>
            <button>Add to Cart</button>
        </div>

        <div class="total">
            <h3>Total Amount: ₹52,000</h3>
            <button>Checkout</button>
        </div>

    </div>

</body>
</html>
